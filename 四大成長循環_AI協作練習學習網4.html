<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>四大成長迴圈 · 高一學習實戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#232838; --ink-soft:#5c6170; --line:#e3e5ec;
  --paper:#fafbfc; --card:#ffffff;
  --c0:#e2553d; --c0b:#fbe7e2;
  --c1:#1f9e83; --c1b:#e0f3ee;
  --c2:#d98a1e; --c2b:#fbeeda;
  --c3:#5b53c7; --c3b:#e8e6fa;
  --accent:var(--c0); --accent-bg:var(--c0b);
  --sans:"Noto Sans TC",system-ui,sans-serif;
  --disp:"Space Grotesk","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans); color:var(--ink); background:var(--paper);
  background-image:radial-gradient(var(--line) 1px,transparent 1px);
  background-size:24px 24px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}

/* ---------- top bar ---------- */
header.bar{
  position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);
  background:rgba(250,251,252,.86);border-bottom:1px solid var(--line);
}
.bar .wrap{display:flex;align-items:center;gap:16px;height:62px}
.brand{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.5px;white-space:nowrap}
.brand b{color:var(--accent);transition:color .4s}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.tab{
  font-family:var(--sans);font-weight:700;font-size:17.5px;cursor:pointer;
  border:1px solid transparent;background:none;color:var(--ink-soft);
  padding:7px 12px;border-radius:999px;display:flex;align-items:center;gap:7px;transition:.2s;
}
.tab .dot{width:9px;height:9px;border-radius:50%;background:var(--td)}
.tab:hover{color:var(--ink);background:#fff}
.tab.on{color:#fff;background:var(--td);box-shadow:0 4px 14px -4px var(--td)}
.tab.on .dot{background:#fff}

/* ---------- hero ---------- */
.hero{padding:64px 0 28px;text-align:center}
.eyebrow{font-family:var(--disp);font-weight:500;letter-spacing:4px;font-size:17px;color:var(--ink-soft);margin-bottom:18px}
.hero h1{font-size:clamp(34px,6vw,60px);font-weight:900;letter-spacing:1px;line-height:1.15}
.hero h1 .x{color:var(--ink-soft);font-family:var(--disp);font-weight:400;margin:0 .12em}
.hero p.sub{max-width:640px;margin:20px auto 0;color:var(--ink-soft);font-size:20px}
.hero .who{display:inline-block;margin-top:22px;font-size:17.5px;font-weight:700;color:var(--accent);background:var(--accent-bg);padding:6px 16px;border-radius:999px;transition:.4s}
.hero .lead{max-width:760px;margin:30px auto 0;font-size:19px;color:var(--ink);text-align:left;background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:18px 22px;transition:border-color .4s}

/* mini four-up preview */
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:34px auto 0;max-width:820px}
.pv{cursor:pointer;border:1px solid var(--line);border-radius:14px;background:#fff;padding:16px 12px;text-align:center;transition:.2s}
.pv:hover{transform:translateY(-3px);box-shadow:0 12px 24px -16px rgba(0,0,0,.3)}
.pv .pvn{font-family:var(--disp);font-weight:700;font-size:17px;color:var(--pc)}
.pv .pvs{font-weight:900;font-size:19px;margin-top:6px;letter-spacing:1px}
@media(max-width:680px){.preview{grid-template-columns:repeat(2,1fr)}}

/* ---------- framework panel ---------- */
.panel{padding:30px 0 10px;display:none}
.panel.on{display:block;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.fhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.ftag{font-family:var(--disp);font-weight:700;color:var(--accent);font-size:19px;transition:.4s}
.fstages{font-size:clamp(26px,4.4vw,40px);font-weight:900;letter-spacing:1px}
.fstages .ar{color:var(--ink-soft);font-weight:400;margin:0 .18em}
.fen{font-family:var(--disp);color:var(--ink-soft);font-size:18px;letter-spacing:1px;margin-top:2px}
.fcore{margin:14px 0 4px;font-size:19.5px;max-width:760px}
.fcore b{color:var(--accent);transition:.4s}
.rule{height:3px;background:var(--accent);border-radius:3px;width:64px;margin:14px 0 8px;transition:.4s}

/* loop + detail */
.loopgrid{display:grid;grid-template-columns:minmax(260px,1fr) 1fr;gap:30px;align-items:center;margin:18px 0 6px}
@media(max-width:760px){.loopgrid{grid-template-columns:1fr;gap:8px}}
.loopwrap{position:relative}
.loopwrap svg{width:100%;height:auto;display:block;overflow:visible}
.node{cursor:pointer}
.node circle{transition:.25s}
.node text{pointer-events:none;font-family:var(--sans)}
.hint{text-align:center;font-size:16.5px;color:var(--ink-soft);margin-top:6px}

.detail{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 26px;min-height:170px;transition:.3s}
.detail .dn{display:inline-flex;align-items:center;gap:9px;font-weight:900;font-size:26px;margin-bottom:8px}
.detail .dn i{font-family:var(--disp);font-style:normal;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;background:var(--accent);font-size:19px;transition:.4s}
.detail p{font-size:19.5px;color:var(--ink)}
.detail .dlabel{font-size:16px;letter-spacing:2px;font-family:var(--disp);color:var(--ink-soft);text-transform:uppercase;margin-bottom:10px}

/* examples */
.exhead{font-weight:900;font-size:23px;margin:30px 0 4px;display:flex;align-items:center;gap:10px}
.exhead::before{content:"";width:16px;height:16px;border-radius:5px;background:var(--accent);transition:.4s}
.exsub{color:var(--ink-soft);font-size:17.5px;margin-bottom:16px}
.exgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:880px){.exgrid{grid-template-columns:1fr}}
.ex{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.ex:hover{box-shadow:0 16px 32px -22px rgba(0,0,0,.35)}
.ex .ext{padding:16px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-bg);transition:.4s}
.ex .ext h4{font-size:20px;font-weight:900}
.ex .ext .num{font-family:var(--disp);font-weight:700;font-size:17px;color:var(--accent);transition:.4s}
.ex .chev{transition:.3s;color:var(--accent)}
.ex.open .chev{transform:rotate(180deg)}
.ex .body{display:none;padding:6px 18px 18px}
.ex.open .body{display:block;animation:fade .3s ease}
.step{display:flex;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line)}
.step .stag{flex:0 0 auto;font-weight:900;font-size:17px;color:#fff;background:var(--accent);border-radius:7px;padding:3px 9px;height:fit-content;transition:.4s;white-space:nowrap}
.step .stx{font-size:18px;color:var(--ink)}
.aibox{margin-top:14px;background:var(--ink);border-radius:13px;padding:15px 16px;color:#eef0f6}
.aibox .ait{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;margin-bottom:9px}
.aibox .chip{font-family:var(--disp);font-weight:700;font-size:15px;background:var(--accent);color:#fff;padding:2px 8px;border-radius:6px;letter-spacing:1px;transition:.4s}
.aibox ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.aibox li{font-size:17.5px;line-height:1.6;padding-left:18px;position:relative;color:#dfe2ec}
.aibox li::before{content:"▸";position:absolute;left:0;color:var(--accent);transition:.4s}

/* scratchpad */
.pad{margin:34px 0 6px;background:#fff;border:1px dashed var(--accent);border-radius:16px;padding:22px 24px;transition:.4s}
.pad h3{font-size:21px;font-weight:900;display:flex;align-items:center;gap:9px}
.pad h3 .badge{font-size:15px;font-family:var(--disp);background:var(--accent-bg);color:var(--accent);padding:3px 9px;border-radius:6px;font-weight:700;transition:.4s}
.pad p.tip{font-size:17px;color:var(--ink-soft);margin:6px 0 16px}
.padrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.padrow{grid-template-columns:1fr}}
.padcell label{display:block;font-weight:900;font-size:17.5px;color:var(--accent);margin-bottom:6px;transition:.4s}
.padcell textarea{width:100%;min-height:78px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--sans);font-size:18px;color:var(--ink);background:var(--paper)}
.padcell textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.askai{margin-top:14px;font-size:17px;color:var(--ink-soft);background:var(--accent-bg);border-radius:10px;padding:11px 14px;transition:.4s}
.askai b{color:var(--accent);transition:.4s}

/* closing */
.closing{margin:60px 0 30px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px 30px}
.closing h2{font-size:24px;font-weight:900;text-align:center;margin-bottom:8px}
.closing .csub{text-align:center;color:var(--ink-soft);font-size:18px;margin-bottom:24px}
.crow{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:760px){.crow{grid-template-columns:1fr}}
.ccard{border-radius:14px;padding:20px;border:1px solid var(--line)}
.ccard .cn{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1}
.ccard h4{font-size:20px;font-weight:900;margin:8px 0 6px}
.ccard p{font-size:17.5px;color:var(--ink-soft)}
footer{text-align:center;color:var(--ink-soft);font-size:16.5px;padding:26px 0 50px}
footer .ft{font-family:var(--disp);letter-spacing:1px}

:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <div class="brand">成長迴圈<b>·LAB</b></div>
    <nav class="tabs" id="tabs" aria-label="四大架構"></nav>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="eyebrow">GROWTH × AI · 高中一年級</div>
    <h1>四大成長迴圈</h1>
    <p class="sub" id="heroSub"></p>
    <div class="who">適用對象：高中一年級學生</div>
    <p class="lead" id="heroLead"></p>
    <div class="preview" id="preview"></div>
  </section>

  <div id="panels"></div>

  <section class="closing" id="closing"></section>
</main>

<footer>
  <div class="ft">成長迴圈 · LAB</div>
  <div>把方法變成行動，讓 AI 成為你的學習夥伴 ｜ 共四大架構 · 十二個實例</div>
</footer>

<script>
const DATA = {
  heroSub:"四組可以反覆使用的成長循環，配上十二個高中生真實情境，以及 AI 在每一步能幫上的忙。",
  lead:"學習與成長不是靠運氣，而是有方法的。下面四組架構各自是一個「循環」：先看清現況、再做出調整，然後回頭檢視。點選任一架構，探索它的三個階段、三個實例，以及 AI 可以扮演的角色。記得——AI 是強大的副駕駛，但方向盤握在你手上。",
  themes:[
    {v:"--c0",b:"--c0b"},{v:"--c1",b:"--c1b"},{v:"--c2",b:"--c2b"},{v:"--c3",b:"--c3b"}
  ],
  frameworks:[
    {tag:"架構一",en:"Aware · Reflect · Change",stages:["覺察","省思","改變"],
     core:"個人成長與後設認知的循環：先察覺現況，再深入反思根本原因，最後做出實際改變。",
     stageDesc:["誠實看見「我現在的狀態到底是什麼」。","追問「為什麼會這樣？造成了什麼影響？」","依據反思，做出一個具體、做得到的調整。"],
     examples:[
      {name:"手機使用與專注力",steps:[
        "用手機內建的螢幕使用時間，發現平日每天滑社群超過 4 小時，常在念書時分心。",
        "問自己「這些時間換來了什麼？」——發現睡眠變少、作業拖到很晚、隔天精神不濟。",
        "設定每天社群上限 1 小時，睡前 30 分鐘把手機放到房間外充電。"],
       ai:["請 AI 助理分析一週使用紀錄，找出最容易分心的「高峰時段」。",
        "請 AI 規劃可取代滑手機的活動清單（運動、閱讀、和朋友約）。",
        "用 AI 設定情境提醒，例如念書時段自動回覆訊息、提醒該休息了。"]},
      {name:"某科成績長期卡關",steps:[
        "發現數學小考連續三次落在及格邊緣，比其他科明顯落後。",
        "檢視錯題後發現不是不會，而是「觀念懂但常粗心」加上「考試時間不夠」。",
        "改成限時練習，每題寫下檢查步驟，並建立個人易錯清單。"],
       ai:["用 AI 把錯題分類，找出反覆出錯的共同盲點。",
        "請 AI 依你的弱點出客製練習題，難度循序漸進。",
        "請 AI 用不同解法講解同一觀念，直到你真的懂為止。"]},
      {name:"情緒與人際衝突",steps:[
        "注意到自己最近常為小事對家人、同學發脾氣。",
        "回顧情緒紀錄，發現多半發生在睡不夠或考試壓力大的時候。",
        "練習「先深呼吸十秒再回應」，並安排固定的紓壓時間。"],
       ai:["用 AI 情緒日記陪你記錄心情，並標記出觸發點。",
        "和 AI 角色扮演，演練難開口的道歉或溝通對話。",
        "請 AI 引導一段簡短的正念或放鬆練習。"]}
     ]},
    {tag:"架構二",en:"Know · Believe · Act",stages:["認知","信念","行動"],
     core:"先建立正確認知，內化成自己相信的信念，最後轉化為持續的行動。",
     stageDesc:["弄懂事情的事實與原理是什麼。","把知識內化成「我真的相信」的價值觀。","讓信念落地，變成日常會做的事。"],
     examples:[
      {name:"養成成長型思維",steps:[
        "認識「大腦像肌肉，會因為練習而改變（神經可塑性）」。",
        "相信「我現在不會，不代表永遠不會，只是還沒學會」。",
        "遇到難題先試 15 分鐘再求助，把「我不行」改說成「我還在學」。"],
       ai:["請 AI 用生活化的比喻解釋大腦可塑性。",
        "用 AI 蒐集運動員或科學家「從失敗到成功」的成長故事。",
        "請 AI 在你卡關時只給「提示」而不是直接答案，練習自己想。"]},
      {name:"建立健康生活習慣",steps:[
        "了解規律運動與睡眠如何影響專注力與情緒。",
        "相信「照顧身體就是照顧成績與心情」，不是浪費時間。",
        "每週運動三次、固定就寢時間，從小目標開始累積。"],
       ai:["用 AI 規劃適合學生、不需器材的居家運動菜單。",
        "請 AI 分析三餐照片，給出簡單的營養建議。",
        "用 AI 追蹤睡眠與運動紀錄，每週給你一次回饋。"]},
      {name:"資訊判讀與媒體素養",steps:[
        "認識網路訊息有真有假，了解「查證來源」的重要。",
        "相信「轉發前先查證」是每個人的責任。",
        "看到聳動消息，先找兩個可信來源比對，再決定信不信、分不分享。"],
       ai:["請 AI 協助查核一則訊息的可信度與原始出處。",
        "用 AI 比較同一事件中不同媒體的報導角度。",
        "請 AI 教你辨識常見假訊息手法（提醒：AI 也會出錯，最後仍要自己判斷）。"]}
     ]},
    {tag:"架構三",en:"Task · Steps · Check",stages:["任務","步驟","檢核"],
     core:"把一件要完成的事拆成可執行的步驟，並用檢核確保品質與完成度。",
     stageDesc:["清楚定義「要完成什麼、做到什麼程度」。","把任務拆成有順序、可執行的小步驟。","用清單逐項確認，確保真的完成且品質達標。"],
     examples:[
      {name:"完成主題報告／小論文",steps:[
        "兩週內完成一份約 2000 字的主題報告。",
        "①確定題目大綱 ②蒐集整理資料 ③撰寫初稿 ④修改排版 ⑤檢查引用。",
        "對照評分標準逐項打勾——主題清楚？論點有證據？格式正確？沒有抄襲？"],
       ai:["用 AI 一起腦力激盪題目方向與大綱結構。",
        "請 AI 摘要長篇參考資料，幫你列出重點。",
        "用 AI 檢查語句通順與標點，並提醒哪裡需要補上出處。"]},
      {name:"籌備一場班級活動",steps:[
        "規劃一次班級同樂會。",
        "①決定主題日期 ②分工（場地、食物、遊戲、經費）③估算預算 ④當天執行。",
        "活動前用檢查清單確認每項就緒，活動後收集回饋檢討。"],
       ai:["用 AI 產生活動點子與當天的時間流程表。",
        "請 AI 試算不同人數下的預算分配。",
        "用 AI 把同學的問卷回饋整理成一頁總結。"]},
      {name:"準備一次段考",steps:[
        "在考前十天完成各科複習。",
        "①盤點考試範圍 ②分配每日進度 ③複習加做題 ④整理錯題。",
        "每天睡前勾選今日進度，用小測驗確認真的記住了。"],
       ai:["請 AI 依你的時間與弱項，排出一份讀書計畫表。",
        "用 AI 把課本重點做成問答卡，方便快速複習。",
        "請 AI 出模擬題並即時批改，解釋你錯在哪裡。"]}
     ]},
    {tag:"架構四",en:"Goal · Strategy · Verify",stages:["目標","策略","驗證"],
     core:"設定明確目標，選擇可行策略，並透過驗證確認是否達標、需不需要調整。",
     stageDesc:["訂出明確、可衡量的目標（SMART）。","規劃達成目標的具體做法與資源。","用數據或證據檢查成效，再決定要不要調整。"],
     examples:[
      {name:"提升英文能力",steps:[
        "一學期內，英文段考從 70 分進步到 85 分（明確又可衡量）。",
        "每天背 10 個單字、每週看一部英文影片做聽寫、固定練習文法題。",
        "每兩週做一次模擬測驗，比對進步幅度，沒進步就調整方法。"],
       ai:["用 AI 依你的程度生成單字與例句，並安排複習時機。",
        "和 AI 練習英文口說與情境對話，即時糾正。",
        "請 AI 出測驗、評分，並具體指出你的弱點。"]},
      {name:"體適能進步",steps:[
        "兩個月內，800 公尺跑步成績進步 30 秒。",
        "每週三次間歇跑與核心訓練，搭配足夠睡眠與補水。",
        "每兩週實際計時一次，記錄趨勢，依數據加減訓練量。"],
       ai:["請 AI 設計循序漸進、適合初學者的訓練課表。",
        "用 AI 記錄成績並以圖表呈現進步趨勢。",
        "請 AI 在成績停滯時，建議該如何調整訓練。"]},
      {name:"生涯與選組探索",steps:[
        "高一下學期前，初步確定文組／理組的方向。",
        "探索有興趣的科目、訪談學長姐與職人、參加體驗活動或線上課程。",
        "用反思紀錄檢視「哪些活動讓我有熱情」，必要時修正方向。"],
       ai:["請 AI 依你的興趣與特質，提供可能的學群與職業參考。",
        "用 AI 模擬不同科系的學習內容與日常樣貌。",
        "請 AI 整理你的探索筆記，找出反覆出現的興趣線索。"]}
     ]}
  ],
  closing:{title:"聰明使用 AI 的三個提醒",sub:"AI 是夥伴，不是替身。把這三件事放在心上。",
    points:[
      {h:"保持主導",p:"AI 給建議，最終的判斷與決定要由你自己完成。"},
      {h:"查證再信",p:"AI 可能會說錯或編造，重要資訊請用可信來源再確認。"},
      {h:"保護隱私",p:"不要把個人敏感資料、他人隱私隨意輸入給 AI。"}
    ]}
};

const root=document.documentElement;
function setTheme(i){
  root.style.setProperty('--accent','var('+DATA.themes[i].v+')');
  root.style.setProperty('--accent-bg','var('+DATA.themes[i].b+')');
}

// hero
document.getElementById('heroSub').textContent=DATA.heroSub;
document.getElementById('heroLead').textContent=DATA.lead;

// tabs + preview
const tabsEl=document.getElementById('tabs');
const pvEl=document.getElementById('preview');
DATA.frameworks.forEach((fw,i)=>{
  const col=getComputedStyle(root).getPropertyValue(DATA.themes[i].v).trim();
  const b=document.createElement('button');
  b.className='tab';b.style.setProperty('--td',col);
  b.innerHTML=`<span class="dot"></span>${fw.tag}`;
  b.onclick=()=>show(i);
  tabsEl.appendChild(b);

  const p=document.createElement('div');
  p.className='pv';p.style.setProperty('--pc',col);
  p.innerHTML=`<div class="pvn">${fw.tag}</div><div class="pvs">${fw.stages.join('·')}</div>`;
  p.onclick=()=>{show(i);document.getElementById('panels').scrollIntoView({behavior:'smooth',block:'start'});};
  pvEl.appendChild(p);
});

// loop SVG builder
function buildLoop(fw,i,colorHex){
  const cx=200,cy=170,R=120,nr=46,gap=27;
  const ang=[-90,30,150];
  const pt=(a,r=R)=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];
  let arcs='';
  for(let k=0;k<3;k++){
    const a1=ang[k]+gap, a2=ang[(k+1)%3]-gap+(k===2?360:0);
    const [x1,y1]=pt(a1),[x2,y2]=pt(a2);
    arcs+=`<path d="M${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 0 1 ${x2.toFixed(1)},${y2.toFixed(1)}"
      fill="none" stroke="${colorHex}" stroke-width="3" stroke-linecap="round"
      marker-end="url(#ar${i})" class="loopArc" opacity=".55"/>`;
  }
  let nodes='';
  fw.stages.forEach((s,k)=>{
    const [x,y]=pt(ang[k]);
    nodes+=`<g class="node" data-fw="${i}" data-k="${k}" tabindex="0" role="button" aria-label="${s}">
      <circle cx="${x}" cy="${y}" r="${nr}" fill="#fff" stroke="${colorHex}" stroke-width="2.5"/>
      <text x="${x}" y="${y-7}" text-anchor="middle" font-family="Space Grotesk" font-size="15" font-weight="700" fill="${colorHex}">0${k+1}</text>
      <text x="${x}" y="${y+18}" text-anchor="middle" font-size="20" font-weight="900" fill="#232838">${s}</text>
    </g>`;
  });
  return `<svg viewBox="0 0 400 300" role="img" aria-label="${fw.stages.join('、')}循環圖">
    <defs><marker id="ar${i}" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="${colorHex}"/></marker></defs>
    <g class="dashring">${arcs}</g>${nodes}</svg>`;
}

// panels
const panelsEl=document.getElementById('panels');
DATA.frameworks.forEach((fw,i)=>{
  const colorHex=getComputedStyle(root).getPropertyValue(DATA.themes[i].v).trim();
  const sec=document.createElement('section');
  sec.className='panel';sec.id='panel'+i;

  const stagesHTML=fw.stages.map((s,j)=>`<span>${s}</span>`).join('<span class="ar">→</span>');

  let exHTML='';
  fw.examples.forEach((ex,k)=>{
    const steps=ex.steps.map((st,j)=>`<div class="step"><span class="stag">${fw.stages[j]}</span><span class="stx">${st}</span></div>`).join('');
    const ai=ex.ai.map(a=>`<li>${a}</li>`).join('');
    exHTML+=`<div class="ex" data-ex="${k}">
      <div class="ext" role="button" tabindex="0" aria-expanded="false">
        <div><span class="num">實例 0${k+1}</span><h4>${ex.name}</h4></div>
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="body">
        ${steps}
        <div class="aibox">
          <div class="ait"><span class="chip">AI</span>可以這樣幫你</div>
          <ul>${ai}</ul>
        </div>
      </div>
    </div>`;
  });

  sec.innerHTML=`
    <div class="fhead"><span class="ftag">${fw.tag}</span>
      <div class="fstages">${stagesHTML}</div></div>
    <div class="fen">${fw.en}</div>
    <div class="rule"></div>
    <p class="fcore"><b>核心概念：</b>${fw.core}</p>

    <div class="loopgrid">
      <div>
        <div class="loopwrap">${buildLoop(fw,i,colorHex)}</div>
        <div class="hint">點選任一階段，看看它代表什麼 ↻ 循環往復、持續精進</div>
      </div>
      <div class="detail" id="detail${i}">
        <div class="dlabel">STAGE DETAIL</div>
        <div class="dn"><i>01</i><span>${fw.stages[0]}</span></div>
        <p>${fw.stageDesc[0]}</p>
      </div>
    </div>

    <div class="exhead">三個實際情境</div>
    <div class="exsub">點開每張卡片，看完整的三階段做法與 AI 的角色。</div>
    <div class="exgrid">${exHTML}</div>

    <div class="pad">
      <h3><span class="badge">DIY</span>換你試試：我的${fw.stages.join('・')}迴圈</h3>
      <p class="tip">挑一件最近想改善的事，依三個階段寫下來。寫完可以把它貼給 AI，請它給你建議。</p>
      <div class="padrow">
        <div class="padcell"><label>① ${fw.stages[0]}</label><textarea placeholder="我現在的情況是…"></textarea></div>
        <div class="padcell"><label>② ${fw.stages[1]}</label><textarea placeholder="${fw.stages[1]}：…"></textarea></div>
        <div class="padcell"><label>③ ${fw.stages[2]}</label><textarea placeholder="${fw.stages[2]}：…"></textarea></div>
      </div>
      <div class="askai">💬 給 AI 的提示句：<b>「我是高一學生，想用『${fw.stages.join('→')}』來處理這件事：（貼上你寫的內容）。請給我具體、做得到的建議。」</b></div>
    </div>`;
  panelsEl.appendChild(sec);
});

// closing
const c=DATA.closing;
document.getElementById('closing').innerHTML=
  `<h2>${c.title}</h2><div class="csub">${c.sub}</div><div class="crow">`+
  c.points.map((p,i)=>{
    const col=getComputedStyle(root).getPropertyValue(DATA.themes[i].v).trim();
    const bg=getComputedStyle(root).getPropertyValue(DATA.themes[i].b).trim();
    return `<div class="ccard" style="background:${bg};border-color:${col}33">
      <div class="cn" style="color:${col}">0${i+1}</div>
      <h4>${p.h}</h4><p>${p.p}</p></div>`;
  }).join('')+`</div>`;

// interactions
function selectStage(i,k){
  setTheme(i);
  const fw=DATA.frameworks[i];
  const d=document.getElementById('detail'+i);
  const colorHex=getComputedStyle(root).getPropertyValue(DATA.themes[i].v).trim();
  d.innerHTML=`<div class="dlabel">STAGE DETAIL</div>
    <div class="dn"><i>0${k+1}</i><span>${fw.stages[k]}</span></div>
    <p>${fw.stageDesc[k]}</p>`;
  // node highlight
  document.querySelectorAll('#panel'+i+' .node').forEach(n=>{
    const on=+n.dataset.k===k;
    const circ=n.querySelector('circle');
    circ.setAttribute('fill',on?colorHex:'#fff');
    n.querySelectorAll('text')[0].setAttribute('fill',on?'#fff':colorHex);
    n.querySelectorAll('text')[1].setAttribute('fill',on?'#fff':'#232838');
    circ.setAttribute('r',on?50:46);
  });
}
document.addEventListener('click',e=>{
  const node=e.target.closest('.node');
  if(node){selectStage(+node.dataset.fw,+node.dataset.k);return;}
  const ext=e.target.closest('.ext');
  if(ext){const ex=ext.closest('.ex');const op=ex.classList.toggle('open');ext.setAttribute('aria-expanded',op);}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const node=e.target.closest('.node');
  if(node){e.preventDefault();selectStage(+node.dataset.fw,+node.dataset.k);return;}
  const ext=e.target.closest('.ext');
  if(ext){e.preventDefault();const ex=ext.closest('.ex');const op=ex.classList.toggle('open');ext.setAttribute('aria-expanded',op);}
});

function show(i){
  setTheme(i);
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on',j===i));
  document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('on',j===i));
  selectStage(i,0);
}
show(0);
</script>
</body>
</html>
