<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四大思維框架 × AI 角色</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F2EC; --panel:#FBFAF6; --ink:#1B2233; --mute:#6A7180; --line:#E2E0D6;
  --ai:#4B40A8; --ai-tint:#EDEBFA; --ai-line:#D8D3F3;
  --f1:#B0760F; --f1-tint:#F7EED8; --f1-soft:#FBF6EA;
  --f2:#0E7C66; --f2-tint:#DCEFE9; --f2-soft:#ECF6F2;
  --f3:#39539E; --f3-tint:#E0E6F3; --f3-soft:#EFF2F9;
  --f4:#A93567; --f4-tint:#F3DCE7; --f4-soft:#FAEEF3;
  --hue:var(--f1); --hue-tint:var(--f1-tint); --hue-soft:var(--f1-soft);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC",system-ui,sans-serif; font-weight:400;
  line-height:1.75; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(var(--line) 0.8px, transparent 0.8px);
  background-size:26px 26px;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
.serif{font-family:"Noto Serif TC",serif}
.mono{font-family:"Space Grotesk",sans-serif;font-feature-settings:"tnum"}

/* ---------- hero ---------- */
header{padding:64px 0 30px}
.eyebrow{font-family:"Space Grotesk",sans-serif;letter-spacing:.32em;text-transform:uppercase;
  font-size:12px;color:var(--mute);font-weight:500;margin-bottom:18px}
h1.title{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(34px,6vw,58px);
  line-height:1.12;letter-spacing:.01em}
h1.title .x{color:var(--mute);font-weight:600;margin:0 .15em}
.sub{font-size:clamp(15px,2.2vw,18px);color:var(--mute);max-width:46em;margin-top:18px;font-weight:500}
.intro{margin-top:22px;max-width:50em;font-size:15.5px;line-height:1.95;color:#3a4150}

/* ---------- overview rails ---------- */
.overview{margin:40px 0 8px;display:grid;gap:14px}
.ovhint{font-family:"Space Grotesk",sans-serif;font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.rail{display:flex;align-items:center;gap:0;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:14px 18px;cursor:pointer;text-align:left;width:100%;
  transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;position:relative;overflow:hidden}
.rail:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.rail::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--rh)}
.rail:hover{transform:translateX(4px);box-shadow:0 8px 22px -14px rgba(27,34,51,.4);border-color:var(--rh)}
.rail .rn{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:13px;color:var(--rh);
  width:34px;flex:0 0 34px}
.rail .stages{display:flex;align-items:center;flex:1;gap:0;flex-wrap:wrap}
.rail .stg{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(15px,2.4vw,19px);white-space:nowrap}
.rail .arr{color:var(--rh);margin:0 12px;font-weight:700;opacity:.7}
.rail .tag{margin-left:auto;font-size:12.5px;color:var(--mute);font-weight:500;white-space:nowrap;padding-left:14px}
.rail .go{color:var(--rh);font-weight:700;font-size:18px;margin-left:14px;transition:transform .2s}
.rail:hover .go{transform:translateX(3px)}

/* ---------- sticky tabs ---------- */
.tabs{position:sticky;top:0;z-index:30;background:rgba(243,242,236,.9);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);margin-top:46px}
.tabsrow{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.tabsrow::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:9px 17px;cursor:pointer;font-family:"Noto Sans TC";font-weight:700;font-size:14px;color:var(--mute);
  transition:all .2s ease;white-space:nowrap}
.tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--td);margin-right:8px;vertical-align:1px}
.tab:hover{color:var(--ink);border-color:var(--td)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- detail panel ---------- */
.panel{padding:34px 0 70px}
.phead{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:8px}
.pkicker{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:14px;letter-spacing:.1em;color:var(--hue)}
.ptitle{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(26px,4.4vw,38px);line-height:1.15}
.ptag{display:inline-block;font-size:13px;font-weight:700;color:var(--hue);background:var(--hue-tint);
  border-radius:999px;padding:5px 14px;margin-top:6px}
.pdesc{color:#3a4150;max-width:54em;margin-top:14px;font-size:15.5px;line-height:1.95}

/* big stage flow (signature) */
.flow{display:flex;align-items:stretch;gap:0;margin:30px 0 10px;flex-wrap:wrap}
.fnode{flex:1 1 0;min-width:150px;background:var(--panel);border:1.5px solid var(--line);
  border-radius:16px;padding:18px 18px 20px;cursor:pointer;position:relative;
  transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease, background .22s ease}
.fnode:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.fnode .fnum{display:block;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:13px;color:var(--hue);letter-spacing:.05em}
.fnode .fname{display:block;font-family:"Noto Serif TC",serif;font-weight:900;font-size:25px;margin-top:5px;letter-spacing:.05em}
.fnode .frole{display:block;font-size:12.5px;color:var(--mute);margin-top:9px;font-weight:500;line-height:1.65}
.fnode:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(27,34,51,.5);border-color:var(--hue)}
.fnode[aria-pressed="true"]{background:var(--hue-soft);border-color:var(--hue);box-shadow:0 10px 26px -16px var(--hue)}
.farrow{display:flex;align-items:center;justify-content:center;color:var(--hue);font-size:22px;
  font-weight:700;padding:0 6px;flex:0 0 auto}
.filterbar{margin:6px 0 26px;font-size:13px;color:var(--mute);display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:24px}
.clear{border:1px solid var(--hue);color:var(--hue);background:transparent;border-radius:999px;
  padding:4px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:"Noto Sans TC"}
.clear:hover{background:var(--hue-tint)}

/* example cards */
.cards{display:grid;gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:0 1px 0 rgba(27,34,51,.03)}
.card .chead{padding:20px 22px 0}
.exn{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:13px;color:var(--hue);letter-spacing:.08em}
.extitle{font-family:"Noto Serif TC",serif;font-weight:700;font-size:21px;margin-top:2px;line-height:1.3}
.scene{display:flex;gap:10px;align-items:baseline;margin:14px 22px 4px;background:var(--hue-soft);
  border-left:4px solid var(--hue);border-radius:0 10px 10px 0;padding:11px 14px}
.scene .lab{font-weight:700;color:var(--hue);font-size:12.5px;flex:0 0 auto;font-family:"Space Grotesk",sans-serif;letter-spacing:.06em}
.scene .txt{font-size:14px;color:#3a4150}
.steps{padding:14px 22px 22px;display:grid;gap:0}
.step{display:grid;grid-template-columns:64px 1fr;gap:0;padding:16px 0;border-top:1px solid var(--line);
  transition:opacity .25s ease, filter .25s ease}
.step:first-child{border-top:none}
.step .marker{display:flex;flex-direction:column;align-items:center;gap:6px}
.step .snum{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:12px;color:#fff;
  background:var(--hue);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.step .sname{font-family:"Noto Serif TC",serif;font-weight:700;font-size:14px;color:var(--hue);writing-mode:vertical-rl;letter-spacing:.12em}
.step .sbody{padding-left:6px}
.step .practice{font-size:14.5px;line-height:1.85;color:#2c333f}
.aibox{margin-top:11px;background:var(--ai-tint);border:1px solid var(--ai-line);border-radius:12px;
  padding:11px 14px}
.aibox .arow{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.aibox .chip{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:11px;letter-spacing:.1em;
  color:#fff;background:var(--ai);border-radius:6px;padding:2px 8px}
.aibox .arole{font-weight:700;font-size:13.5px;color:var(--ai)}
.aibox .afn{font-size:13.5px;line-height:1.8;color:#3a3a52}
.step.dim{opacity:.32;filter:grayscale(.4)}
.step.hot{background:linear-gradient(90deg,var(--hue-soft),transparent 70%);border-radius:12px}

footer{border-top:1px solid var(--line);padding:34px 0 60px;color:var(--mute);font-size:13.5px}
footer b{color:var(--ink)}
footer .note{max-width:52em;margin-top:8px;line-height:1.9}

@media(max-width:680px){
  .rail .tag{display:none}
  .flow{flex-direction:column}
  .farrow{transform:rotate(90deg);padding:4px 0}
  .step{grid-template-columns:48px 1fr}
  .step .sname{writing-mode:horizontal-tb;letter-spacing:.02em}
  header{padding:44px 0 20px}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Thinking Frameworks × AI</div>
    <h1 class="title">四大思維框架<span class="x">×</span>AI 角色</h1>
    <p class="sub" id="sub"></p>
    <p class="intro" id="intro"></p>

    <div class="overview" id="overview">
      <div class="ovhint">四種三段式思維 · 點選展開</div>
    </div>
  </header>
</div>

<nav class="tabs"><div class="wrap"><div class="tabsrow" id="tabs" role="tablist"></div></div></nav>

<main class="wrap">
  <section class="panel" id="panel" aria-live="polite"></section>
</main>

<footer><div class="wrap">
  <b>使用提醒</b>
  <p class="note">四個框架都是三段式，著力點卻不同：<b>覺察·省思·改變</b>看的是「自己」，<b>認知·信念·行動</b>看的是「價值」，<b>任務·步驟·檢核</b>看的是「把事做完做好」，<b>目標·策略·驗證</b>看的是「成果與證據」。</p>
  <p class="note">AI 的定位是夥伴而非代理人：讓它做整理、提問、規劃、檢核這些放大思考的事；價值判斷、最終決策與真正的產出仍由學生完成，學習才會留在學生身上。涉及心理健康的應用，AI 僅為輔助，必要時請轉介專業人員。</p>
</div></footer>

<script>
// 四大思維框架 × AI 角色｜共用內容資料

<script>
const HUE=["f1","f2","f3","f4"];
const sub=document.getElementById("sub"), intro=document.getElementById("intro");
sub.textContent=DATA.subtitle; intro.textContent=DATA.intro;

/* ---- overview rails ---- */
const ov=document.getElementById("overview");
DATA.frameworks.forEach((f,i)=>{
  const b=document.createElement("button");
  b.className="rail"; b.style.setProperty("--rh",`var(--${f.id})`);
  b.setAttribute("aria-label",`框架 ${i+1}：${f.name}`);
  const stg=f.stages.map(s=>`<span class="stg">${s}</span>`).join('<span class="arr">→</span>');
  b.innerHTML=`<span class="rn mono">0${i+1}</span><span class="stages">${stg}</span>`+
              `<span class="tag">${f.tagline}</span><span class="go">→</span>`;
  b.addEventListener("click",()=>{select(i);document.querySelector(".tabs").scrollIntoView({block:"start"});});
  ov.appendChild(b);
});

/* ---- tabs ---- */
const tabsEl=document.getElementById("tabs");
DATA.frameworks.forEach((f,i)=>{
  const t=document.createElement("button");
  t.className="tab"; t.setAttribute("role","tab"); t.id="tab"+i;
  t.style.setProperty("--td",`var(--${f.id})`);
  t.innerHTML=`<span class="dot"></span>框架${i+1}　${f.name}`;
  t.addEventListener("click",()=>select(i));
  tabsEl.appendChild(t);
});

const panel=document.getElementById("panel");
let cur=-1, activeStage=-1;

function setHue(id){
  document.documentElement.style.setProperty("--hue",`var(--${id})`);
  document.documentElement.style.setProperty("--hue-tint",`var(--${id}-tint)`);
  document.documentElement.style.setProperty("--hue-soft",`var(--${id}-soft)`);
}

function select(i){
  if(i===cur) return;
  cur=i; activeStage=-1;
  const f=DATA.frameworks[i];
  setHue(f.id);
  [...tabsEl.children].forEach((t,k)=>t.setAttribute("aria-selected",k===i?"true":"false"));
  render(f);
}

function render(f){
  const flow=f.stages.map((s,k)=>{
    // pull each example's AI role for this stage to preview on the node
    const node=`<button class="fnode" data-stage="${k}" aria-pressed="false" aria-label="聚焦階段：${s}">
        <span class="fnum mono">STAGE 0${k+1}</span>
        <span class="fname">${s}</span>
        <span class="frole">點選聚焦此階段，看三個實例怎麼做、AI 做什麼</span>
      </button>`;
    return node + (k<f.stages.length-1?'<span class="farrow">→</span>':'');
  }).join("");

  const cards=f.examples.map((ex,ei)=>{
    const steps=ex.steps.map((st,si)=>`
      <div class="step" data-stage="${si}">
        <div class="marker">
          <span class="snum mono">0${si+1}</span>
          <span class="sname">${f.stages[si]}</span>
        </div>
        <div class="sbody">
          <div class="practice">${st.practice}</div>
          <div class="aibox">
            <div class="arow"><span class="chip mono">AI</span><span class="arole">${st.ai}</span></div>
            <div class="afn">${st.aifn}</div>
          </div>
        </div>
      </div>`).join("");
    return `<article class="card">
      <div class="chead"><div class="exn mono">EXAMPLE ${cur+1}-${ei+1}</div>
        <div class="extitle">${ex.title}</div></div>
      <div class="scene"><span class="lab">情境</span><span class="txt">${ex.scene}</span></div>
      <div class="steps">${steps}</div>
    </article>`;
  }).join("");

  panel.innerHTML=`
    <div class="phead">
      <div>
        <div class="pkicker mono">FRAMEWORK 0${cur+1}</div>
        <h2 class="ptitle">${f.name}</h2>
        <span class="ptag">${f.tagline}</span>
      </div>
    </div>
    <p class="pdesc">${f.desc}</p>
    <div class="flow">${flow}</div>
    <div class="filterbar" id="filterbar"></div>
    <div class="cards">${cards}</div>`;

  panel.querySelectorAll(".fnode").forEach(n=>{
    n.addEventListener("click",()=>toggleStage(parseInt(n.dataset.stage)));
  });
}

function toggleStage(k){
  activeStage = (activeStage===k)? -1 : k;
  const f=DATA.frameworks[cur];
  panel.querySelectorAll(".fnode").forEach(n=>
    n.setAttribute("aria-pressed", parseInt(n.dataset.stage)===activeStage?"true":"false"));
  panel.querySelectorAll(".step").forEach(s=>{
    const sk=parseInt(s.dataset.stage);
    s.classList.toggle("dim", activeStage!==-1 && sk!==activeStage);
    s.classList.toggle("hot", activeStage!==-1 && sk===activeStage);
  });
  const bar=document.getElementById("filterbar");
  if(activeStage===-1){ bar.innerHTML=""; }
  else{
    bar.innerHTML=`正在聚焦階段　<b style="color:var(--hue)">${f.stages[activeStage]}</b>　—　看三個實例在這一步各自怎麼做
      <button class="clear" id="clearbtn">顯示全部</button>`;
    document.getElementById("clearbtn").addEventListener("click",()=>toggleStage(activeStage));
  }
}

select(0);
</script>
